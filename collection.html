<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Collection — EIN SOF Jewellery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page-header {
    text-align: center;
    padding: 60px 32px 20px;
  }
  .collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
    padding: 20px 32px 100px;
  }
  @media (max-width: 620px) {
    .collection-grid {
      grid-template-columns: 1fr;
      padding: 20px 16px 80px;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="EIN SOF Jewellery" height="32">
      <span class="logo-text">EIN SOF <em>Jewellery</em></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#story">My Story</a></li>
      <li><a href="index.html#collection">Collection</a></li>
      <li><a href="index.html#custom">Custom Pieces</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="top">
  <div class="page-header container">
    <p class="section-eyebrow">The Collection</p>
    <h2>Every piece, made once</h2>
  </div>

  <div id="full-collection-grid" class="collection-grid container"></div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <svg class="logo-mark small" viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,4 33,27 7,27" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <polygon points="20,36 7,13 33,13" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <p>EIN SOF Jewellery — Handmade Jewish Jewellery.</p>
    <p class="footer-year" id="footerYear"></p>
  </div>
</footer>

<script>
const navToggle = document.getElementById('navToggle');
const navLinks = document.getElementById('navLinks');

navToggle.addEventListener('click', () => {
  const isOpen = navLinks.classList.toggle('open');
  navToggle.setAttribute('aria-expanded', isOpen);
});

document.getElementById('footerYear').textContent = `© ${new Date().getFullYear()}`;

async function loadFullCollection() {
  const res = await fetch('data.json');
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('full-collection-grid');
  if (!container) return;

  let html = '';
  for (const [name, item] of Object.entries(data)) {
    const imgHtml = item.image ? `<img src="${item.image}" alt="${name}">` : '';
    const desc = item.description ? item.description : 'One of one';

    html += `
      <article class="card card-live">
        <div class="card-section-top">
          <div class="card-section-title">
            <h3>${name}</h3>
          </div>
          <div class="card-section-image">
            ${imgHtml}
          </div>
          <div class="card-section-desc">
            <p class="card-meta">${desc}</p>
          </div>
        </div>
        <div class="card-section-buy">
          <a href="${item.url}" class="btn btn-gold btn-buy">Buy for ${item.price} ${item.currency.toUpperCase()}</a>
        </div>
      </article>
    `;
  }
  container.innerHTML = html;
}

loadFullCollection();
</script>
</body>
</html>
